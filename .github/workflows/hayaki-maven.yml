# Builds the Hayaki Engine for every Android ABI, with the Robolectric library for
# Linux, and publishes it to this repository's `maven` branch
# (tools/publish-hayaki-maven.sh). Hayaki for Android's CI runs its unit tests on Linux,
# so the testing JAR carries only the Linux host library; macOS runners are often
# short of capacity and the Linux cross compiler has no Intel macOS build.
name: Publish Hayaki Engine

on:
  workflow_dispatch:
  push:
    branches:
      - hayaki-rwkv

env:
  ALL_ARCHS: 1
  RELEASE: 1
  ROBOLECTRIC_HOST_ONLY: 1
  CARGO_PROFILE_RELEASE_LTO: fat

concurrency:
  group: hayaki-maven
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip a version that is already published
        id: published
        run: |
          git submodule update --init anki
          version=$(./tools/publish-hayaki-maven.sh --print-version)
          url="https://raw.githubusercontent.com/${{ github.repository }}/maven/io/github/amemiya02/anki-backend-android/$version/anki-backend-android-$version.pom"
          if curl -sfI "$url" >/dev/null; then
            echo "$version is already published"
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Liberate disk space
        if: steps.published.outputs.skip != 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Fetch submodules
        if: steps.published.outputs.skip != 'true'
        run: git submodule update --init

      - name: Ubuntu packages
        if: steps.published.outputs.skip != 'true'
        run: |
          sudo apt update
          sudo apt -y install liblzma-dev

      - uses: actions/cache@v4
        if: steps.published.outputs.skip != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            anki/out/rust
            anki/out/download
            anki/out/extracted
            anki/out/node_modules
          key: hayaki-rust-linux-${{ hashFiles('Cargo.lock', 'anki/Cargo.lock', 'anki/yarn.lock') }}
          restore-keys: hayaki-rust-linux-

      - name: Read configured NDK version
        if: steps.published.outputs.skip != 'true'
        run: |
          cargo install toml-cli
          ANDROID_NDK_VERSION=$(toml get gradle/libs.versions.toml versions.ndk --raw)
          ANDROID_NDK_MAJOR_VERSION=$(echo $ANDROID_NDK_VERSION | cut -f1 -d.)
          ANDROID_NDK_MINOR_VERSION=$(echo $ANDROID_NDK_VERSION | cut -f2 -d.)
          ANDROID_NDK_MARKETING_VERSION="r${ANDROID_NDK_MAJOR_VERSION}"
          if ! [ "$ANDROID_NDK_MINOR_VERSION" == "0" ]; then
            alphabet="abcdefghijklmnopqrstuvwxyz"
            ANDROID_NDK_MARKETING_VERSION="${ANDROID_NDK_MARKETING_VERSION}${alphabet:$ANDROID_NDK_MINOR_VERSION:1}"
          fi
          echo "ANDROID_NDK_VERSION=$ANDROID_NDK_VERSION" >> $GITHUB_ENV
          echo "ANDROID_NDK_MARKETING_VERSION=$ANDROID_NDK_MARKETING_VERSION" >> $GITHUB_ENV
        shell: bash

      - name: Setup Android NDK
        if: steps.published.outputs.skip != 'true'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_MARKETING_VERSION }}
          add-to-path: false
          link-to-sdk: true

      - name: Set NDK version
        if: steps.published.outputs.skip != 'true'
        run: |
          export ANDROID_NDK_LATEST_HOME="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        if: steps.published.outputs.skip != 'true'
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup N2
        if: steps.published.outputs.skip != 'true'
        run: bash ./anki/tools/install-n2

      - uses: gradle/actions/setup-gradle@v4
        if: steps.published.outputs.skip != 'true'

      - name: Build all
        if: steps.published.outputs.skip != 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 120
          max_attempts: 2
          retry_on: error
          command: cargo run -p build_rust

      - name: Publish to the maven branch
        if: steps.published.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./tools/publish-hayaki-maven.sh
